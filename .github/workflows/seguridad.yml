name: Seguridad y tipos

# Puerta mínima antes de mergear. NO reemplaza la revisión humana: cubre lo
# que una máquina detecta sin ambigüedad (tipos, lint, CVE conocidos) para que
# la revisión se concentre en lo que sí requiere criterio.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Lunes 6:00 UTC (1:00 en Colombia): un CVE publicado el fin de semana se
    # ve el lunes temprano, sin depender de que alguien abra un PR.
    - cron: "0 6 * * 1"

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # El cliente de Prisma está gitignorado (se genera en src/generated/prisma),
      # así que sin este paso no compila nada. No necesita base de datos.
      - name: Generar cliente de Prisma
        run: npx prisma generate

      # Los tipos SÍ bloquean: hoy pasan limpio y romperlos siempre es un error real.
      - name: Tipos
        run: npx tsc --noEmit -p tsconfig.json

      # El lint YA bloquea. Nació informativo porque el repo arrastraba 21
      # errores y un check que nace en rojo enseña al equipo a ignorarlo. Ese
      # contador llegó a cero, que era la condición que la nota anterior ponía
      # para volverlo bloqueante. `verificar-lint-linea-base.ts` guarda el mismo
      # cero y falla si alguien lo sube.
      - name: Lint
        run: npm run lint

      - name: Vulnerabilidades conocidas (informativo)
        run: npm audit --audit-level=high
        continue-on-error: true

      # Esto sí bloquea: una vulnerabilidad CRÍTICA no espera a la limpieza de deuda.
      - name: Vulnerabilidades críticas
        run: npm audit --audit-level=critical

  motor-de-grietas:
    # El triage de grietas decide si a alguien se le dice que salga de su casa.
    # Sus dos scripts de verificación son lo más parecido a tests que hay en el
    # repo, y corren sin base de datos ni red.
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: Reglas y triage (43/43 y 37/37)
        run: npm run verify:alerta

  suites:
    # Las 26 suites de `scripts/verificar-*.ts`. Son lo más parecido a tests que
    # hay aquí y ninguna necesita base de datos ni red, así que no hay excusa
    # para no correrlas en cada push. Antes solo corría la de grietas.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: Suites de verificación
        run: |
          fallos=0
          for f in scripts/verificar-*.ts; do
            if npx tsx "$f" > salida.txt 2>&1; then
              echo "OK    $(basename "$f")"
            else
              fallos=$((fallos + 1))
              echo "::error::FALLA $(basename "$f")"
              tail -20 salida.txt
            fi
          done
          echo "---"
          [ "$fallos" -eq 0 ] || { echo "::error::$fallos suite(s) fallaron"; exit 1; }
          echo "Todas las suites pasan.

      - name: Pagos y suscripciones (firmas de Wompi + vigencia)
        run: npm run verify:pagos
